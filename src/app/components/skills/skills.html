<section id="skills" class="skills section">
  <div class="section__container" appReveal>
    <h2 class="section__title">Skills & Technologies</h2>
    <p class="section__subtitle">The tools I use to build reliable software.</p>

    <div class="skills__grid">
      @for (category of categories; track category.name) {
        <div class="skills__category" appReveal>
          <div class="skills__category-header">
            <mat-icon class="skills__category-icon">{{ category.icon }}</mat-icon>
            <h3 class="skills__category-name">{{ category.name }}</h3>
          </div>
          <div class="skills__chips">
            @for (skill of category.skills; track skill) {
              <span class="skills__chip">{{ skill }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
