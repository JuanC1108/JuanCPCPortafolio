<section id="hero" class="hero">
  <!-- Animated background orbs -->
  <div class="hero__bg-orbs" aria-hidden="true">
    <div class="hero__orb hero__orb--1"></div>
    <div class="hero__orb hero__orb--2"></div>
    <div class="hero__orb hero__orb--3"></div>
  </div>

  <div class="hero__container">
    <div class="hero__content">
      <div class="hero__badge" appReveal="blur-in">
        <span class="hero__badge-dot"></span>
        Available for work
      </div>

      <h1 class="hero__headline" appReveal="blur-in" [revealDelay]="100">
        I build reliable software<br>
        <span class="gradient-text">that solves real problems.</span>
      </h1>

      <p class="hero__sub" appReveal="fade-up" [revealDelay]="250">
        {{ content.subheadline }}
      </p>

      <div class="hero__actions" appReveal="fade-up" [revealDelay]="400">
        <a
          mat-flat-button
          class="hero__cta-primary"
          [href]="content.resumeUrl"
          target="_blank"
          rel="noopener"
        >
          <mat-icon>description</mat-icon>
          {{ content.ctaPrimary }}
        </a>
        <a
          mat-stroked-button
          class="hero__cta-secondary"
          href="#contact"
          (click)="$event.preventDefault()"
          onclick="document.getElementById('contact')?.scrollIntoView({behavior:'smooth'})"
        >
          {{ content.ctaSecondary }}
          <mat-icon>arrow_forward</mat-icon>
        </a>
      </div>

      <div class="hero__credibility" appReveal="fade-up" [revealDelay]="550">
        @for (item of content.credibility; track item; let i = $index) {
          <span class="hero__chip" [style.animation-delay]="(i * 80) + 'ms'">{{ item }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="hero__scroll-indicator" appReveal="fade-up" [revealDelay]="800">
    <div class="hero__scroll-line"></div>
  </div>
</section>
