<section id="work" class="work section">
  <div class="section__container" appReveal>
    <h2 class="section__title">Featured Work</h2>
    <p class="section__subtitle">Projects that showcase my approach to solving real problems.</p>

    <div class="work__grid">
      @for (project of projects; track project.title) {
        <div class="work__card" appReveal (click)="openProject(project)" tabindex="0" role="button"
          [attr.aria-label]="'View details for ' + project.title"
          (keydown.enter)="openProject(project)"
        >
          <div class="work__card-header">
            <mat-icon class="work__card-icon">folder_open</mat-icon>
            <div class="work__card-links">
              @if (project.githubUrl) {
                <a mat-icon-button [href]="project.githubUrl" target="_blank" rel="noopener" aria-label="GitHub"
                  (click)="$event.stopPropagation()">
                  <mat-icon>code</mat-icon>
                </a>
              }
            </div>
          </div>
          <h3 class="work__card-title">{{ project.title }}</h3>
          <p class="work__card-problem">{{ project.problem }}</p>
          <p class="work__card-outcome">{{ project.outcome }}</p>
          <div class="work__card-tech">
            @for (tech of project.tech; track tech) {
              <span class="work__tech-chip">{{ tech }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
