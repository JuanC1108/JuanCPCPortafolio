<section id="about" class="about section">
  <div class="section__container" appReveal>
    <h2 class="section__title">{{ content.title }}</h2>

    <div class="about__content">
      <div class="about__story">
        @for (paragraph of content.paragraphs; track $index) {
          <p class="about__paragraph">{{ paragraph }}</p>
        }
      </div>

      <div class="about__values">
        <h3 class="about__values-title">How I Work</h3>
        @for (value of content.values; track value.label) {
          <div class="about__value" appReveal>
            <mat-icon class="about__value-icon">check_circle</mat-icon>
            <div>
              <span class="about__value-label">{{ value.label }}</span>
              <span class="about__value-desc"> — {{ value.description }}</span>
            </div>
          </div>
        }
      </div>

      <div class="about__looking" appReveal>
        <mat-icon class="about__looking-icon">location_searching</mat-icon>
        <p class="about__looking-text">{{ content.looking }}</p>
      </div>
    </div>
  </div>
</section>
