<section id="contact" class="contact section">
  <div class="section__container contact__container">
    <h2 class="section__title" appReveal="blur-in">{{ content.title }}</h2>
    <p class="contact__subtitle" appReveal="blur-in" [revealDelay]="100">{{ content.subtitle }}</p>

    <a
      mat-flat-button
      class="contact__email-btn"
      [href]="'mailto:' + content.email"
      appReveal="scale-up" [revealDelay]="200"
    >
      <mat-icon>email</mat-icon>
      {{ content.email }}
    </a>

    <div class="contact__socials" appReveal="fade-up" [revealDelay]="350">
      @for (social of content.socials; track social.label) {
        <a
          mat-stroked-button
          class="contact__social-btn"
          [href]="social.url"
          target="_blank"
          rel="noopener"
        >
          <mat-icon>{{ social.icon }}</mat-icon>
          {{ social.label }}
        </a>
      }
    </div>

    <p class="contact__availability" appReveal="fade-up" [revealDelay]="450">{{ content.availability }}</p>
  </div>
</section>
